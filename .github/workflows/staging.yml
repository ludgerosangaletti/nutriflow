name: NutriFlow staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nutriflow-staging
  cancel-in-progress: true

jobs:
  test-build-migrate-deploy-smoke:
    name: Test, build, migrate, deploy and smoke
    runs-on: ubuntu-latest
    environment: nutriflow-staging
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout staging
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Workflow tests
        run: npm run test:workflow

      - name: Type-check, lint and build
        run: npm run build

      - name: Apply D1 staging migrations
        run: npx wrangler d1 migrations apply nutriflow-staging --remote --config wrangler.staging.jsonc

      - name: Deploy staging Worker
        run: npx wrangler deploy --config wrangler.staging.jsonc

      - name: Smoke test staging
        shell: bash
        run: |
          set -euo pipefail
          url="https://nutriflow-staging.ludgero-sangaletti.workers.dev/staging-pipeline.txt"
          response="$(curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 5 "$url")"
          test "$response" = "nutriflow-staging-pipeline-v1"
