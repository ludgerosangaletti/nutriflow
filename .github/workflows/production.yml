# First controlled Cloudflare production deployment: 2026-08-21
name: NutriFlow production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Confirmar publicação em produção
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nutriflow-production
  cancel-in-progress: false

jobs:
  test-build-migrate-deploy-smoke:
    if: vars.PRODUCTION_ENABLED == 'true' && (github.event_name == 'push' || inputs.confirm_production == true)
    name: Test, build, migrate, deploy and smoke
    runs-on: ubuntu-latest
    environment: nutriflow-production
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      WORKER_NAME: ${{ vars.WORKER_NAME }}
      PRODUCTION_SMOKE_URL: ${{ vars.PRODUCTION_SMOKE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      NEXT_PUBLIC_WHATSAPP_ATENDIMENTO: ${{ vars.NEXT_PUBLIC_WHATSAPP_ATENDIMENTO }}
      VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
      WHATSAPP_ACTIVATION_TEMPLATE_NAME: ${{ vars.WHATSAPP_ACTIVATION_TEMPLATE_NAME }}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${{ vars.WHATSAPP_BUSINESS_ACCOUNT_ID }}
      WHATSAPP_GRAPH_API_VERSION: ${{ vars.WHATSAPP_GRAPH_API_VERSION }}
      WHATSAPP_PLAN_READY_TEMPLATE_NAME: ${{ vars.WHATSAPP_PLAN_READY_TEMPLATE_NAME }}
      WHATSAPP_RETURN_TEMPLATE_NAME: ${{ vars.WHATSAPP_RETURN_TEMPLATE_NAME }}
      WHATSAPP_TRAINING_READY_TEMPLATE_NAME: ${{ vars.WHATSAPP_TRAINING_READY_TEMPLATE_NAME }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      CHECKIN_REMINDER_SECRET: ${{ secrets.CHECKIN_REMINDER_SECRET }}
      GOOGLE_CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.GOOGLE_CREDENTIALS_ENCRYPTION_KEY }}
      TRAINING_MEDIA_IMPORT_SECRET: ${{ secrets.TRAINING_MEDIA_IMPORT_SECRET }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
      WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
      WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
      WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            D1_DATABASE_ID D1_DATABASE_NAME R2_BUCKET_NAME WORKER_NAME PRODUCTION_SMOKE_URL
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY NEXT_PUBLIC_SUPABASE_URL
            ADMIN_EMAIL CHECKIN_REMINDER_SECRET GOOGLE_CREDENTIALS_ENCRYPTION_KEY
            TRAINING_MEDIA_IMPORT_SECRET VAPID_PRIVATE_KEY VAPID_PUBLIC_KEY
            WHATSAPP_ACCESS_TOKEN WHATSAPP_APP_SECRET WHATSAPP_PHONE_NUMBER_ID WHATSAPP_VERIFY_TOKEN
          )
          for value in "${required[@]}"; do
            test -n "${!value}" || { echo "Missing production setting: $value" >&2; exit 1; }
          done

      - name: Generate immutable production config
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const config = {
            name: process.env.WORKER_NAME,
            main: "dist/server/index.js",
            compatibility_date: "2026-08-20",
            compatibility_flags: ["nodejs_compat"],
            workers_dev: true,
            assets: { directory: "dist/client", binding: "ASSETS", run_worker_first: true },
            d1_databases: [{
              binding: "DB",
              database_name: process.env.D1_DATABASE_NAME,
              database_id: process.env.D1_DATABASE_ID,
              migrations_dir: "drizzle",
              migrations_table: "d1_migrations",
            }],
            r2_buckets: [{ binding: "BUCKET", bucket_name: process.env.R2_BUCKET_NAME }],
            images: { binding: "IMAGES" },
            vars: {
              DEPLOY_ENV: "production",
              NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,
              NEXT_PUBLIC_SUPABASE_URL: process.env.NEXT_PUBLIC_SUPABASE_URL,
              NEXT_PUBLIC_VAPID_PUBLIC_KEY: process.env.NEXT_PUBLIC_VAPID_PUBLIC_KEY,
              NEXT_PUBLIC_WHATSAPP_ATENDIMENTO: process.env.NEXT_PUBLIC_WHATSAPP_ATENDIMENTO,
              VAPID_SUBJECT: process.env.VAPID_SUBJECT,
              WHATSAPP_ACTIVATION_TEMPLATE_NAME: process.env.WHATSAPP_ACTIVATION_TEMPLATE_NAME,
              WHATSAPP_BUSINESS_ACCOUNT_ID: process.env.WHATSAPP_BUSINESS_ACCOUNT_ID,
              WHATSAPP_GRAPH_API_VERSION: process.env.WHATSAPP_GRAPH_API_VERSION,
              WHATSAPP_PLAN_READY_TEMPLATE_NAME: process.env.WHATSAPP_PLAN_READY_TEMPLATE_NAME,
              WHATSAPP_RETURN_TEMPLATE_NAME: process.env.WHATSAPP_RETURN_TEMPLATE_NAME,
              WHATSAPP_TRAINING_READY_TEMPLATE_NAME: process.env.WHATSAPP_TRAINING_READY_TEMPLATE_NAME,
            },
            observability: { enabled: true },
          };
          writeFileSync(".wrangler.production.generated.json", JSON.stringify(config, null, 2));
          NODE

      - name: Install locked dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Workflow tests
        run: npm run test:workflow

      - name: Type-check, lint and build
        run: npm run build

      - name: Reconcile D1 migration history after verified restore
        shell: bash
        run: |
          set -euo pipefail
          cat > .d1-history-bootstrap.sql <<'SQL'
          CREATE TABLE IF NOT EXISTS d1_migrations (
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            name TEXT UNIQUE,
            applied_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP NOT NULL
          );
          WITH expected(name) AS (VALUES ('0000_steady_pete_wisdom.sql'),('0001_mature_iron_man.sql'),('0002_fat_nightcrawler.sql'),('0003_gorgeous_hammerhead.sql'),('0004_aspiring_lilandra.sql'),('0005_natural_war_machine.sql'),('0006_lean_red_hulk.sql'),('0007_hard_shockwave.sql'),('0008_youthful_scarlet_spider.sql'),('0009_panoramic_revanche.sql'),('0010_noisy_lucky_pierre.sql'),('0011_blushing_richard_fisk.sql'),('0012_stiff_skaar.sql'),('0013_lying_legion.sql'),('0014_aspiring_vapor.sql'),('0015_empty_forge.sql'),('0016_fearless_puck.sql'),('0017_closed_infant_terrible.sql'),('0018_wise_black_tarantula.sql'),('0019_chilly_shriek.sql'),('0020_parallel_lucky_pierre.sql'),('0021_true_cerise.sql'),('0022_fantastic_martin_li.sql'),('0023_nutriflow_base_units.sql'),('0024_nutriflow_global_food_catalog.sql'),('0025_nutriflow_clinical_productivity.sql'),('0026_nutriflow_patient_portal.sql'),('0027_nutriflow_beverages_and_flexible_unit.sql'),('0028_patient_reset_archival.sql'),('0029_nutriflow_taco_catalog.sql'),('0030_patient_activation_whatsapp.sql'),('0031_clinical_backlog.sql'),('0032_clinical_backlog_flags.sql'),('0033_pwa_push_subscriptions.sql'),('0034_nutriflow_clinical_assessments.sql'),('0035_nutriflow_energy_expenditure.sql'),('0036_whatsapp_webhook_idempotency.sql'),('0037_resend_webhook_events.sql'),('0038_client_organization_context.sql'),('0039_enable_stable_nutriflow_by_organization.sql'),('0040_nutriflow_training_foundation.sql'),('0041_nutriflow_training_media.sql'),('0042_nutriflow_training_global_library.sql'),('0043_nutriflow_training_media_provenance.sql'),('0044_nutriflow_final_production_transition.sql'),('0045_nutriflow_training_anamnesis.sql'),('0046_nutriflow_training_abdomen_cardio.sql'),('0047_nutriflow_tbca_7_3.sql'),('0048_patient_whatsapp_activation_consent.sql'))
          INSERT OR IGNORE INTO d1_migrations (name)
          SELECT expected.name
          FROM expected
          WHERE (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name <> 'd1_migrations') = 58
            AND EXISTS (SELECT 1 FROM sqlite_master WHERE type='table' AND name='clients');
          SQL
          npx wrangler d1 execute "$D1_DATABASE_NAME" --remote --config .wrangler.production.generated.json --file .d1-history-bootstrap.sql
          rm -f .d1-history-bootstrap.sql

      - name: Apply D1 production migrations
        run: npx wrangler d1 migrations apply "$D1_DATABASE_NAME" --remote --config .wrangler.production.generated.json

      - name: Deploy production Worker
        run: npx wrangler deploy --config .wrangler.production.generated.json

      - name: Install production runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f .production-secrets.json' EXIT
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const keys = [
            "ADMIN_EMAIL",
            "CHECKIN_REMINDER_SECRET",
            "GOOGLE_CREDENTIALS_ENCRYPTION_KEY",
            "TRAINING_MEDIA_IMPORT_SECRET",
            "VAPID_PRIVATE_KEY",
            "VAPID_PUBLIC_KEY",
            "WHATSAPP_ACCESS_TOKEN",
            "WHATSAPP_APP_SECRET",
            "WHATSAPP_PHONE_NUMBER_ID",
            "WHATSAPP_VERIFY_TOKEN",
          ];
          writeFileSync(
            ".production-secrets.json",
            JSON.stringify(Object.fromEntries(keys.map((key) => [key, process.env[key]]))),
            { mode: 0o600 },
          );
          NODE
          npx wrangler secret bulk .production-secrets.json --config .wrangler.production.generated.json

      - name: Smoke test production
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 5 "$PRODUCTION_SMOKE_URL")"
          test "$response" = "nutriflow-staging-pipeline-v1"


